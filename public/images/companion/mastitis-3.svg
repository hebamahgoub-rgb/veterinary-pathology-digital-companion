                  <circle cx="180" cy="92" r="9" fill="#FFFFFF" stroke="#0369A1"></circle>
                  <text x="180" y="145" font-family="Inter, sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">Epithelioid / giant</text>
                  <text x="180" y="158" font-family="Inter, sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">cells &amp; vacuoles</text>

                  <rect x="244" y="8" width="108" height="174" rx="6" fill="#F8FAFC" stroke="#94A3B8"></rect>
