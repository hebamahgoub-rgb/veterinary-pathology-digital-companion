                  <text x="62" y="158" font-family="Inter, sans-serif" font-size="8.5" fill="#334155" text-anchor="middle">acinar atrophy</text>

                  <rect x="126" y="8" width="108" height="174" rx="6" fill="#F8FAFC" stroke="#94A3B8"></rect>
