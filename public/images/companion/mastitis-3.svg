                  <text x="62" y="41" font-family="Inter, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">(PG-36.E019)</text>
                  <path d="M22 75 L102 75 M22 92 L102 92 M22 109 L102 109" stroke="#64748B" stroke-width="3"></path>
