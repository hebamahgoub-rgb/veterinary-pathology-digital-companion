<svg viewBox="0 0 420 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-panel histological schematic comparing serous parotid acini in Panel A, mixed mucous tubules with serous demilunes in Panel B, and intralobular striated versus interlobular excretory ducts in Panel C">
                  <!-- Panel A: Parotid Serous Acini -->
                  <rect x="10" y="10" width="194" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"></rect>
                  <text x="107" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">A. Parotid (Serous Acini)</text>
                  <circle cx="72" cy="76" r="26" fill="#E0E7FF" stroke="#3730A3" stroke-width="1.6"></circle>
                  <circle cx="72" cy="76" r="5" fill="#FFFFFF" stroke="#3730A3" stroke-width="1"></circle>
                  <circle cx="72" cy="56" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="91" cy="76" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="72" cy="95" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="53" cy="76" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="142" cy="78" r="24" fill="#E0E7FF" stroke="#3730A3" stroke-width="1.6"></circle>
                  <circle cx="142" cy="78" r="4.5" fill="#FFFFFF" stroke="#3730A3" stroke-width="1"></circle>
                  <circle cx="142" cy="60" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="159" cy="78" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="142" cy="96" r="3.5" fill="#1E1B4B"></circle>
                  <circle cx="125" cy="78" r="3.5" fill="#1E1B4B"></circle>
                  <text x="107" y="124" font-family="Inter, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Basophilic base &amp; zymogen granules</text>

                  <!-- Panel B: Mixed Mucous + Serous Demilune -->
                  <rect x="216" y="10" width="194" height="128" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"></rect>
                  <text x="313" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">B. Mandibular / Sublingual</text>
                  <ellipse cx="305" cy="76" rx="44" ry="24" fill="#FCE7F3" stroke="#9D174D" stroke-width="1.5"></ellipse>
                  <ellipse cx="305" cy="76" rx="18" ry="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"></ellipse>
                  <path d="M 332 54 C 358 56 364 96 332 98 C 346 86 346 66 332 54 Z" fill="#C7D2FE" stroke="#3730A3" stroke-width="1.5"></path>
                  <rect x="275" y="94" width="8" height="3" rx="1" fill="#1E293B"></rect>
                  <rect x="302" y="95" width="8" height="3" rx="1" fill="#1E293B"></rect>
                  <rect x="275" y="55" width="8" height="3" rx="1" fill="#1E293B"></rect>
                  <text x="313" y="124" font-family="Inter, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Mucous tubule + serous demilune cap</text>

                  <!-- Panel C: Intralobular Striated vs. Interlobular Excretory Duct -->
                  <rect x="10" y="150" width="400" height="130" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"></rect>
                  <text x="210" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle">C. Intralobular Striated Duct vs. Interlobular Excretory Duct</text>
                  <!-- Striated duct -->
                  <circle cx="115" cy="216" r="28" fill="#FDE68A" stroke="#B45309" stroke-width="1.6"></circle>
                  <circle cx="115" cy="216" r="12" fill="#FFFFFF" stroke="#B45309" stroke-width="1.1"></circle>
                  <line x1="115" y1="188" x2="115" y2="195" stroke="#92400E" stroke-width="1.4"></line>
                  <line x1="115" y1="237" x2="115" y2="244" stroke="#92400E" stroke-width="1.4"></line>
                  <line x1="87" y1="216" x2="94" y2="216" stroke="#92400E" stroke-width="1.4"></line>
                  <line x1="136" y1="216" x2="143" y2="216" stroke="#92400E" stroke-width="1.4"></line>
                  <text x="115" y="264" font-family="Inter, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Striated duct (basal striations)</text>

                  <!-- Interlobular excretory duct in fibrous septum -->
                  <rect x="236" y="182" width="144" height="66" rx="14" fill="#E2E8F0" stroke="#64748B" stroke-width="1.4" stroke-dasharray="4 2"></rect>
                  <ellipse cx="308" cy="215" rx="44" ry="20" fill="#BAE6FD" stroke="#0369A1" stroke-width="1.8"></ellipse>
                  <ellipse cx="308" cy="215" rx="28" ry="10" fill="#FFFFFF" stroke="#0369A1" stroke-width="1.1"></ellipse>
                  <text x="308" y="264" font-family="Inter, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Excretory duct in fibrous septum</text>
                </svg>
